<div class="toolbar">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <label style="font-size:13px;font-weight:600;">Report</label>
    <select id="rpType" style="width:240px;">
      <option value="admissions">Admission List</option>
      <option value="payments">Payment Collection Report</option>
      <option value="dues">Due / Outstanding List</option>
      <option value="students">Student List</option>
      <option value="bycourse">Student List by Course</option>
      <option value="bybatch">Student List by Batch</option>
      <option value="fines">Fine and Waived Fine Report</option>
      <option value="monthwise">Month-wise Collection Summary</option>
      <option value="branchwise">Branch-wise Collection Report</option>
    </select>
    <label style="font-size:13px;font-weight:600;margin-left:14px;">From</label>
    <input type="date" id="rpFrom">
    <label style="font-size:13px;font-weight:600;">To</label>
    <input type="date" id="rpTo">
    <button id="rpPreview">Preview</button>
    <button id="rpExcel">Export Excel</button>
    <button id="rpPdf">Export PDF</button>
  </div>
</div>
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <div id="rpInfo" style="padding:12px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);"></div>
    <div class="table-wrap" id="reportsTable"></div>
  </div>
</div>
