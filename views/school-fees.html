<div class="toolbar" style="border:none;padding-bottom:0;margin-bottom:0;">
  <div class="search-box" style="width:320px;">
    <span class="icon-lucide"> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> </span>
    <input type="search" id="sfStudentId" placeholder="Enter Student ID and press Enter">
  </div>
</div>
<div class="panel" id="sfPanel" style="display:none;">
  <div class="panel-body">
    <div id="sfStudentInfo"></div>
    <div class="form-grid" id="sfFeeForm" style="margin-top:14px;">
      <div class="form-group"><label>Month (YYYY-MM)</label><input type="month" id="sfMonth" required></div>
      <div class="form-group"><label>Monthly fee (level)</label><input type="number" id="sfMonthly" readonly></div>
      <div class="form-group"><label>Applicable fine</label><input type="number" id="sfFine" min="0" step="0.01" value="0"></div>
      <div class="form-group"><label>Waiver</label><input type="number" id="sfWaiver" min="0" step="0.01" value="0"><div class="field-note">Reason is recorded.</div></div>
      <div class="form-group"><label>Waiver reason</label><input type="text" id="sfWaiverReason" placeholder="Reason"></div>
      <div class="form-group"><label>Payment method</label><select id="sfMethod"><option value="cash">Cash</option><option value="upi">UPI</option><option value="bank">Bank Transfer</option></select></div>
      <div class="form-group"><label>Payment date</label><input type="date" id="sfDate" required></div>
      <div class="form-group full"><label>Collected by</label><span id="sfCollector"></span></div>
      <div class="form-group full" style="border-top:1px solid var(--line);padding-top:10px;">
        <label style="font-weight:700;">Optional study material (separate line on receipt)</label>
        <div class="form-grid" style="margin-top:8px;">
          <div class="form-group" style="width:220px;"><label>Type</label><select id="sfMatType"><option value="">None</option><option value="Books">Books</option><option value="Accessories">Accessories</option><option value="Uniform">Uniform</option></select></div>
          <div class="form-group" style="width:260px;"><label>Title</label><input type="text" id="sfMatTitle" placeholder="e.g. English Workbook"></div>
          <div class="form-group" style="width:140px;"><label>Price</label><input type="number" id="sfMatPrice" min="0" value="0"></div>
        </div>
      </div>
    </div>
    <div class="actions" style="margin-top:14px;">
      <button type="button" class="secondary" onclick="sfReset()">Clear search</button>
      <button id="sfSave" class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Record Monthly Payment</button>
    </div>
    <div id="sfPrevPayments" style="margin-top:16px;"></div>
  </div>
</div>
